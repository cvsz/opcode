name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m py_compile scripts/*.py dashboard/server.py
      - run: python -m unittest discover -s tests -v
      - run: shellcheck scripts/load-keys.sh
      - name: Make targets parse
        run: make -n help test keys optimize >/dev/null
