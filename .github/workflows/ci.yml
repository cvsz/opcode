name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m py_compile scripts/*.py dashboard/server.py
      - run: python -m unittest discover -s tests -v
      - run: shellcheck scripts/load-keys.sh
      - name: Make targets parse
        run: make -n help test keys optimize >/dev/null
      - name: No committed bytecode or secrets
        run: |
          ! git ls-files | grep -E '(__pycache__|\.pyc$|^\.keys\.env$)'
